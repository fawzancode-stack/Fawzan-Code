<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحتي الشخصية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }
        h1 {
            margin: 10px 0 5px;
            font-size: 22px;
            color: #333;
        }
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .profile-img {
    width: 105px;
    height: 105px;
    border-radius: 50%;         /* يجعل الصورة دائري تماماً */
    object-fit: cover;           /* يمنع تمطيط أو تشويه الصورة */
    border: 3px solid #007bff;   /* إطار ملون حول الصورة بلون أزرق */
    box-shadow: 0 4px 8px rgba(0,0,0,0.15); /* ظل خفيف حول الصورة */
    margin-bottom: 15px;
}
    </style>
</head>
<body>

    <div class="card">
        <img src="Fawzan.png" alt="الصورة الشخصية" class="profile-img">
        <h1> Fawzan Bahkli</h1>
        <p>مطور مواقع متدرب | أحب تعلم برمجة الويب وبناء المشاريع التفاعلية.</p>

    </div>

</body>
</html>
